name: CI/CD - Build & Déploiement Automatisé

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permet de relancer le déploiement manuellement en 1 clic depuis l'app GitHub sur mobile !

permissions:
  contents: read
  packages: write

jobs:
  # Étape 1 : Vérification de la qualité du code et compilation
  test-and-build:
    name: 🧪 Validation & Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier la cohérence TypeScript
        run: npm run lint

      - name: Compiler les assets de production (Vite)
        run: npm run build

  # Étape 2 : Déploiement automatique
  deploy:
    name: 🚀 Déploiement Automatique
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      # Déploiement via Webhook Render (si configuré dans les secrets GitHub)
      - name: Déclencher le déploiement Render
        if: "${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}"
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🔄 Déclenchement du webhook de déploiement Render..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${RENDER_HOOK}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Déploiement déclenché avec succès sur Render !"
          else
            echo "⚠️ Le webhook a répondu avec le statut HTTP $STATUS"
          fi

      # Étape d'information si le webhook n'est pas encore configuré
      - name: Info webhook
        if: "${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}"
        run: |
          echo "ℹ️ Note : Le secret RENDER_DEPLOY_HOOK_URL n'est pas encore configuré."
          echo "Pour déclencher automatiquement le déploiement sur Render, ajoutez ce secret dans GitHub > Settings > Secrets and variables > Actions."

      # Construction et publication automatique de l'image Docker sur GitHub Container Registry (GHCR)
      - name: Préparer le nom d'image Docker en minuscules
        id: docker_prep
        run: |
          # Docker requiert strictement des caractères minuscules pour les noms d'images
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${LOWER_REPO}" >> $GITHUB_OUTPUT

      - name: Connexion au registre GitHub Container Registry
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.docker_prep.outputs.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construire et publier l'image Docker
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Résumé visuel dans GitHub Actions
      - name: Rapport de Déploiement
        run: |
          echo "### 📱 Déploiement CI/CD terminé avec succès !" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation** : ✅ TypeScript et Build Vite validés sans aucune erreur." >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "- **Hébergement Render** : 🚀 Webhook de mise à jour déclenché !" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Hébergement Render** : ℹ️ Pensez à renseigner \`RENDER_DEPLOY_HOOK_URL\` dans les secrets GitHub pour lier votre instance en 1 clic." >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Usage Mobile** : Ouvrez l'URL HTTPS sur votre smartphone et appuyez sur **« Ajouter à l'écran d'accueil »** pour l'utiliser comme une application native !" >> $GITHUB_STEP_SUMMARY
